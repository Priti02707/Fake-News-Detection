name: Production smoke checks
on:
  workflow_dispatch:
    inputs:
      research_models:
        description: Run real CLIP, NLI and Whisper checks with model downloads
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: verity-production-smoke
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: https://fake-news-detection-priti.vercel.app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production desktop and mobile workflows
        run: npm run test:e2e -- --workers=1
      - name: Real local-file OCR and video timeline
        env:
          MEDIA_INTEGRATION: '1'
        run: npm run test:e2e -- --workers=1 --grep 'video frames create a real|image extraction requires'
      - name: Optional real CLIP, NLI and Whisper
        if: inputs.research_models
        env:
          MEDIA_INTEGRATION: '1'
          RESEARCH_INTEGRATION: '1'
        run: npm run test:e2e -- --workers=1 --project=desktop --grep 'local semantic ranking|visual-language comparison|video speech is extracted|actual audio transcription'
